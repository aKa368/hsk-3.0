name: Build Android APK & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Core JS Modules
        run: |
          node -e "
            const fs = require('fs');
            global.window = global;
            global.document = { addEventListener: () => {} };
            global.localStorage = { getItem: () => null, setItem: () => {} };
            eval(fs.readFileSync('strokes.js', 'utf8'));
            eval(fs.readFileSync('data.js', 'utf8'));
            eval(fs.readFileSync('practice_essays_data.js', 'utf8'));
            eval(fs.readFileSync('curriculum_data.js', 'utf8'));
            eval(fs.readFileSync('lazidi_data.js', 'utf8'));
            eval(fs.readFileSync('lazidi_images.js', 'utf8'));
            eval(fs.readFileSync('visual_entity_library.js', 'utf8'));
            eval(fs.readFileSync('visual_vocab_data.js', 'utf8'));
            eval(fs.readFileSync('dict_data.js', 'utf8'));
            console.log('✅ ALL JS DATA MODULES VALIDATED SUCCESSFULLY!');
          "

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSK_3.0_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
